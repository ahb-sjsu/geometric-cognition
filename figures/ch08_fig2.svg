<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The correction filter is a projection; sycophancy is its leakage"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The correction filter is a projection; sycophancy is its leakage</text><text x="128.00" y="76.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">valid correction</text><text x="128.00" y="94.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">E lies in V: all of it passes</text><line x1="32.00" y1="290.00" x2="224.00" y2="290.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="224.00" y="308.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">V: valid directions</text><line x1="60.00" y1="268.00" x2="190.00" y2="268.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="190.00" y1="268.00" x2="183.14" y2="272.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="190.00" y1="268.00" x2="183.14" y2="263.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="125.00" y="258.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">E</text><line x1="60.00" y1="290.00" x2="190.00" y2="290.00" stroke="#66c2a5" stroke-width="3.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="190.00" y1="290.00" x2="183.14" y2="294.12" stroke="#66c2a5" stroke-width="3.