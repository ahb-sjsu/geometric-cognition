00" r="5.00" fill="#8da0cb"></circle><text x="306.00" y="326.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">filtered = 0</text><text x="592.00" y="76.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">invalid correction, leaky filter</text><text x="592.00" y="94.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">a fraction λ = 0.5 passes</text><line x1="496.00" y1="290.00" x2="688.00" y2="290.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="688.00" y="308.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">V: valid directions</text><line x1="589.00" y1="177.42" x2="589.00" y2="290.00" stroke="#8fa4b8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4" stroke-opacity="1.0"/><line x1="524.00" y1="290.00" x2="589.00" y2="177.42" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="589.00" y1="177.42" x2="589.14" y2="185.42" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="589.00" y1="177.42" x2="582.00" y2="181.29" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="599.00" y="181.42" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="start" font-weight="600">E</text><line x1="524.00" y1="290.00" x2="589.00" y2="290.00" stroke="#fc8d62" stroke-width="3.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="589.00" y1="290.00" x2="582.14" y2="294.12" stroke="#fc8d62" stroke-width="3.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="589.00" y1="290.00" x2="582.14" y2="285.88" stroke="#fc8d62" stroke-width="3.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="556.50" y="326.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="middle" font-weight="normal">filtered = λ |E|</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">schematic: filtered evidence = projection of E onto V; λ = 0.5 is illustrative, not a measured leakage</text></svg>