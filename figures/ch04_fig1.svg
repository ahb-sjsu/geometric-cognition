<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Selective attention narrows the metric under a fixed budget"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Selective attention narrows the metric under a fixed budget</text><line x1="30.00" y1="205.00" x2="230.00" y2="205.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="130.00" y1="105.00" x2="130.00" y2="305.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><ellipse cx="130.00" cy="205.00" rx="68.00" ry="68.00" transform="rotate(0 130.00 205.00)" fill="#66c2a5" fill-opacity="0.14" stroke="#66c2a5" stroke-width="2"><title>α = 1.0, β = 1.0</title></ellipse><text x="130.00" y="74.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">baseline</text><text x="130.00" y="92.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">α = 1.0,  β = 1.0</text><line x1="260.00" y1="205.00" x2="460.00" y2="205.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="360.00" y1="105.00" x2="360.00" y2="305.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><ellipse cx="360.00" cy="205.00" rx="83.28" ry="48.08" transform="rotate(0 360.00 205.00)" fill="#fc8d62" fill-opacity="0.14" stroke="#fc8d62" stroke-width="2"><title>α = 1.5, β = 0.5</title></ellipse><text x="360.00" y="74.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">selective</text><text x="360.00" y="92.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">α = 1.5,  β = 0.5</text><line x1="490.00" y1="205.00" x2="690.00" y2="205.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="590.00" y1="105.00" x2="590.00" y2="305.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><ellipse cx="590.00" cy="205.00" rx="93.73" ry="21.50" transform="rotate(0 590.00 205.00)" fill="#8da0cb" fill-opacity="0.14" stroke="#8da0cb" stroke-width="2"><title>α = 1.9, β = 0.1</title></ellipse><text x="590.00" y="74.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">strongly selective</text><text x="590.00" y="92.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">α = 1.9,  β = 0.1</text><text x="360.00" y="332.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">α + β = 2 in every panel: amplifying one dimension suppresses the other</text><text x="360.00" y="352.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">horizontal axis: attended dimension; vertical axis: unattended dimension</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">semi-axes proportional to sqrt(α) and sqrt(β); identity baseline; illustrative values</text></svg>